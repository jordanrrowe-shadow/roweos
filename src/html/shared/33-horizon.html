
      <!-- v35.13: Horizon — personal finance planner (Dashboard / Calendar / Income & Recurring / Accounts / Planner). The Horizon React SPA is vendored at /horizon/ in dist and embedded here same-origin, so its localStorage key (horizon_v1) lives under roweos.com and is backed up to Firestore by 54-horizon.js. Admin-only: nav item hidden for non-admins and showView('horizon') redirects them to Settings. -->
      <div id="horizonView" class="panel-view hidden">
        <div style="display:flex;flex-direction:column;height:100%;">
          <div style="display:flex;align-items:center;gap:var(--space-3);padding:10px var(--space-4);border-bottom:1px solid var(--border-color);flex-shrink:0;">
            <span class="panel-header" style="margin:0;font-size:15px;">Horizon</span>
            <span style="color:var(--text-muted);font-size:12px;">Your financial future, planned</span>
            <span style="flex:1;"></span>
            <button type="button" class="btn-secondary" style="font-size:12px;padding:4px 10px;" onclick="if(window.HorizonBridge)HorizonBridge.importData();">Import data</button>
            <button type="button" class="btn-secondary" style="font-size:12px;padding:4px 10px;" onclick="if(window.HorizonBridge)HorizonBridge.exportData();">Export</button>
            <button type="button" class="btn-secondary" style="font-size:12px;padding:4px 10px;" onclick="window.open('/horizon/','_blank');">Full screen</button>
          </div>
          <div style="flex:1;min-height:0;">
            <iframe id="horizonFrame" title="Horizon financial planner" style="width:100%;height:100%;border:0;display:block;background:var(--bg-primary);"></iframe>
          </div>
        </div>
      </div>
