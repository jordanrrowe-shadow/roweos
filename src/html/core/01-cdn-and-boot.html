  <div id="bootScreen" style="position:fixed;inset:0;z-index:99999;background:#0a0a0a;"></div>
  <script>try{if(localStorage.getItem('roweos-theme')==='light'){document.getElementById('bootScreen').style.background='#f5f3ee';}}catch(e){}</script>
  <!-- v35.3: boot screen safety net. The boot screen is removed by
       showAuthGate() / showStartupScreen() after Firestore's Promise.all of
       ~45 reads resolves. When the network is slow or the Firestore
       long-polling channel rejects with CORS, that Promise.all hangs for
       60s+ before timing out and the user is stuck on a black screen.
       This timer is the belt-and-suspenders: after 10s, force-remove the
       boot screen so the user sees the auth gate / app even if cloud sync
       hasn't completed. The Firestore reads continue in the background and
       merge whenever they arrive. Tracked on window so other code can clear
       the timer if cloud sync completes normally. -->
  <script>
    window._bootScreenSafetyTimer = setTimeout(function() {
      try {
        var b = document.getElementById('bootScreen');
        if (b && b.parentNode) {
          console.warn('[Boot] Safety timeout reached (10s) — forcing boot screen removal so the app is reachable.');
          b.remove();
        }
      } catch(e) {}
    }, 10000);
  </script>
